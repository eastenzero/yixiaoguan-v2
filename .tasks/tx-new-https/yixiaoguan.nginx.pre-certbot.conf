# Yixiaoguan v2 — TX-NEW Tencent Cloud
# 3 virtual hosts on :80 (HTTP), certbot --nginx will add :443 + redirect
#   - yxg.xiaoguan.site     -> student-app
#   - teacher.xiaoguan.site -> teacher-app
#   - dify.xiaoguan.site    -> reverse proxy to Dify docker-nginx on 127.0.0.1:3000

# ------------------------- shared proxy snippets are inlined below -------------------------

# ============================== STUDENT ==============================
server {
    listen 80;
    listen [::]:80;
    server_name yxg.xiaoguan.site;

    root /var/www/yixiaoguan/student;
    index index.html;
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /centrifugo/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /bi/ {
        alias /var/www/yixiaoguan/bi/;
        try_files $uri $uri/ /bi/index.html;
    }
}

