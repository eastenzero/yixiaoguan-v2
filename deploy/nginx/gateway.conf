# Yixiaoguan v2 — student app on port 80, teacher app on port 81.
# /api/ + /ws reverse-proxy to gateway 127.0.0.1:8100.
# Static H5 served from /var/www/yixiaoguan/{student,teacher}/.
# Deploy: copy this to /etc/nginx/sites-available/yixiaoguan,
#         symlink into sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.

# --- Student-app on port 80 ---
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.100.165 _;

    root /var/www/yixiaoguan/student;
    index index.html;
    client_max_body_size 50m;

    # SPA fallback for vue-router history mode (safe for hash mode too)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: gateway HTTP API
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Reverse proxy: legacy WebSocket.
    # Keep this as an exact match: browsers do not follow Nginx's automatic
    # /ws -> /ws/ redirect during WebSocket handshakes.
    location = /ws {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# --- Teacher-app on port 81 ---
server {
    listen 81;
    listen [::]:81;
    server_name 192.168.100.165 _;

    root /var/www/yixiaoguan/teacher;
    index index.html;
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
