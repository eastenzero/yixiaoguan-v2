services:
  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: yxg-centrifugo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./centrifugo-config.json:/centrifugo/config.json:ro
    environment:
      - CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_SECRET}
      - CENTRIFUGO_HTTP_API_KEY=${CENTRIFUGO_API_KEY}
      - CENTRIFUGO_CHANNEL_PROXY_SUBSCRIBE_HTTP_STATIC_HEADERS={"X-Auth":"${CENTRIFUGO_PROXY_SECRET}"}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: centrifugo -c config.json
