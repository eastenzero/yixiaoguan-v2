<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Login - 医小管教师工作台</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#faf5fb",
                    "on-secondary-container": "#612c90",
                    "inverse-primary": "#a476ff",
                    "on-secondary": "#fbefff",
                    "on-surface": "#2f2e32",
                    "secondary-container": "#e6c5ff",
                    "primary": "#702ae1",
                    "secondary-fixed-dim": "#ddb3ff",
                    "inverse-surface": "#0e0e11",
                    "error-dim": "#a70138",
                    "background": "#faf5fb",
                    "error-container": "#f74b6d",
                    "on-primary-fixed": "#000000",
                    "surface-container-high": "#e5e1e8",
                    "tertiary-dim": "#8e294c",
                    "on-error": "#ffefef",
                    "surface-variant": "#e0dbe3",
                    "surface-container-lowest": "#ffffff",
                    "primary-dim": "#6411d5",
                    "inverse-on-surface": "#9f9ca1",
                    "on-background": "#2f2e32",
                    "primary-fixed-dim": "#a67aff",
                    "tertiary-fixed": "#ff8eac",
                    "on-error-container": "#510017",
                    "outline-variant": "#afacb1",
                    "tertiary-fixed-dim": "#f77c9e",
                    "primary-container": "#b28cff",
                    "surface-dim": "#d7d3db",
                    "on-tertiary": "#ffeff1",
                    "secondary": "#7742a6",
                    "surface-container-highest": "#e0dbe3",
                    "on-tertiary-fixed-variant": "#711036",
                    "on-tertiary-fixed": "#380016",
                    "on-secondary-fixed-variant": "#6b369a",
                    "primary-fixed": "#b28cff",
                    "error": "#b41340",
                    "tertiary": "#9e3657",
                    "on-tertiary-container": "#64042d",
                    "on-primary-container": "#2e006c",
                    "outline": "#78767b",
                    "surface-container": "#ebe7ed",
                    "secondary-fixed": "#e6c5ff",
                    "tertiary-container": "#ff8eac",
                    "on-secondary-fixed": "#4d137b",
                    "surface-container-low": "#f4eff5",
                    "surface-bright": "#faf5fb",
                    "surface-tint": "#702ae1",
                    "secondary-dim": "#6a3599",
                    "on-primary": "#f8f0ff",
                    "on-primary-fixed-variant": "#390083",
                    "on-surface-variant": "#5d5b5f"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-up {
            animation: fade-up 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<!-- Login Container -->
<main class="relative min-h-screen w-full flex flex-col items-center justify-center bg-gradient-to-br from-primary-fixed-dim via-primary to-primary-dim">
<!-- Abstract Background Orbs -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[60%] h-[40%] bg-secondary-container/20 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary-container/30 rounded-full blur-[120px]"></div>
</div>
<!-- Central Login Card -->
<div class="relative w-full max-w-md px-6 animate-fade-up">
<div class="bg-surface-container-lowest/95 backdrop-blur-2xl rounded-xl p-10 shadow-[0_32px_64px_-12px_rgba(0,0,0,0.15)] border border-white/20">
<!-- Logo Area -->
<div class="flex flex-col items-center mb-10">
<div class="w-20 h-20 bg-gradient-to-tr from-primary to-primary-container rounded-lg flex items-center justify-center mb-6 shadow-lg rotate-3">
<span class="material-symbols-outlined text-white text-5xl" data-icon="school">school</span>
</div>
<h1 class="text-3xl font-extrabold text-on-surface tracking-tight mb-2">医小管</h1>
<p class="text-on-surface-variant font-medium tracking-[0.1em] text-sm">教师工作台</p>
</div>
<!-- Form Section -->
<form class="space-y-6">
<!-- Username Field -->
<div class="space-y-2">
<label class="block text-xs font-bold text-on-surface-variant ml-2 uppercase tracking-widest">Username</label>
<div class="group relative flex items-center">
<div class="absolute left-4 text-primary transition-transform group-focus-within:scale-110">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low rounded-lg border-none focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-on-surface-variant/50 transition-all" placeholder="请输入教师工号" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-xs font-bold text-on-surface-variant ml-2 uppercase tracking-widest">Password</label>
<div class="group relative flex items-center">
<div class="absolute left-4 text-primary transition-transform group-focus-within:scale-110">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-low rounded-lg border-none focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-on-surface-variant/50 transition-all" placeholder="请输入登录密码" type="password"/>
<button class="absolute right-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center px-2">
<label class="flex items-center cursor-pointer group">
<div class="relative">
<input class="peer hidden" type="checkbox"/>
<div class="w-5 h-5 bg-surface-container border-2 border-outline-variant rounded-md peer-checked:bg-primary peer-checked:border-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xs scale-0 peer-checked:scale-100 transition-transform" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<span class="ml-3 text-sm font-medium text-on-surface-variant group-hover:text-on-surface transition-colors">记住我</span>
</label>
<a class="ml-auto text-sm font-semibold text-primary hover:text-primary-dim transition-colors" href="#">忘记密码？</a>
</div>
<!-- Login Button -->
<div class="pt-4">
<button class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-white font-bold rounded-lg shadow-[0_8px_20px_-4px_rgba(112,42,225,0.4)] active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">
<span>立即登录</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Alternate Login Options (Soft visual hierarchy) -->
<div class="mt-8 pt-8 border-t border-surface-container-high flex flex-col items-center">
<p class="text-xs text-on-surface-variant font-medium mb-4">其他登录方式</p>
<div class="flex gap-6">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="qr_code_scanner">qr_code_scanner</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="fingerprint">fingerprint</span>
</button>
</div>
</div>
</div>
</div>
<!-- Footer -->
<footer class="mt-12 text-center px-6 animate-fade-up" style="animation-delay: 0.2s">
<p class="text-primary-fixed/70 text-xs font-medium tracking-wide">
                山东第一医科大学 · 医小管智能管理系统
            </p>
<p class="text-primary-fixed/40 text-[10px] mt-2 uppercase tracking-[0.2em]">
                © 2024 Intelligent Management System
            </p>
</footer>
</main>
</body></html>
