<div class="relative">
<img alt="Avatar" class="w-14 h-14 rounded-full object-cover border-2 border-primary/10" data-alt="portrait of a young female student with soft natural lighting and calm academic background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB0mnLddO7vGEyv-XlfV9JlaPZUhg_FDHDROcRMfraxf2lPxWD-mHaSReUTOe8shaQ9_9C68GSEWOJbyp81PGn3Cp3jQ3OrP3FPvv1SNcuyoAjwg-9ojnfAL3E-wQCHPUimVU-TPQjSsk_gYrsoM9QINL5aEXf-0rC-sd3BaIuZr25pZfxgle11Jww7NKVZztEGX3Cnud9Bo4-dc9O8d9p4i7tGPeu9n52r093sAJyK_pBhXfcPdjZgrO58-xpfXUiP1HTuh4gkIQ"/>
<div class="absolute bottom-0 right-0 w-4 h-4 bg-green-500 border-2 border-white rounded-full"></div>
</div>
<div class="flex-1">
<div class="flex items-center justify-between">
<h2 class="title-lg font-bold">张小洋</h2>
<span class="bg-primary-container text-on-primary-container text-xs font-bold px-3 py-1 rounded-full">待处理</span>
</div>
<p class="text-on-surface-variant body-md mt-0.5">护理学院 · 2023级本科</p>
</div>
</div>
</section>
<!-- Chat History -->
<section class="space-y-6">
<!-- Student Message -->
<div class="flex flex-col items-end animate-fade-up" style="animation-delay: 200ms;">
<div class="max-w-[85%] bg-primary p-4 rounded-t-2xl rounded-bl-2xl shadow-[0_8px_24px_-4px_rgba(112,42,225,0.12)]">
<p class="text-on-primary body-md leading-relaxed">请问学校的电费缴纳在哪里操作？我看校微中心没找到入口，宿舍快停电了有点急，麻烦老师指路一下。</p>
</div>
<span class="text-[10px] text-on-surface-variant mt-2 px-1">14:30</span>
</div>
<!-- AI Response (Refusal) -->
<div class="flex items-start gap-3 animate-fade-up" style="animation-delay: 300ms;">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="smart_toy" style="font-variation-settings: 'FILL' 1">smart_toy</span>
</div>
<div class="flex flex-col">
<div class="max-w-[90%] bg-white border border-error/20 p-4 rounded-t-2xl rounded-br-2xl relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-error"></div>
<p class="text-on-surface body-md leading-relaxed">很抱歉，医小管目前尚未学习到关于“校微中心电费缴纳入口”的相关说明。系统提示可能在“智慧校园”APP的“后勤服务”模块中进行。已为您呼叫人工老师处理。</p>
</div>
<span class="text-[10px] text-on-surface-variant mt-2 px-1">14:31</span>
</div>
</div>
<!-- System Message -->
<div class="flex justify-center animate-fade-up" style="animation-delay: 400ms;">
<div class="bg-surface-container rounded-full px-4 py-1.5 flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="notifications">notifications</span>
<span class="text-on-surface-variant label-md">学生已呼叫老师 — 14:32</span>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Bar -->
<!-- Case: Pending State (Rendered as requested: Large primary button) -->
<div class="fixed bottom-0 left-0 w-full z-50 p-6 bg-white/90 backdrop-blur-xl animate-fade-up" style="animation-delay: 500ms;">
<div class="max-w-2xl mx-auto">
<button class="w-full h-14 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold title-lg shadow-[0_12px_32px_-4px_rgba(112,42,225,0.2)] active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="assignment_ind" style="font-variation-settings: 'FILL' 1">assignment_ind</span>

</div>
