        desc: ''
        instruction: '你是一个意图分类器。根据用户的输入，判断其意图类别。


          分类规则：

          - greeting: 问候语（你好、嗨、早上好、在吗 等）

          - chitchat: 闲聊（谢谢、再见、你是谁、你叫什么 等非校园事务）

          - kb_query: 校园事务咨询（任何关于学校规则、流程、时间、地点的问题）

          - transfer: 明确要求转人工（找老师、转人工、人工客服 等）'
