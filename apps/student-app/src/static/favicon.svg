  </g>
  <path d="M668.5 354.2 C684.4 364.8 699.8 364.6 718.2 355.2 L810.1 306.4 C829.1 296.4 844.2 293.2 865.7 299.7 L1019.2 348.9 C1033.8 353.5 1046.3 350.4 1061.9 341.6" fill="none" stroke="url(#capUnderGradient)" stroke-width="8" stroke-linecap="round" opacity="0.55" filter="url(#fineBlur)"/>
