<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="520 160 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Recreated purple medical graduation logo</title>
  <desc id="desc">A vector recreation of a soft purple and blue graduation cap, medical cross, speech bubble, shield and leaves on a transparent background.</desc>
  <defs>
    <linearGradient id="capGradient" x1="594" y1="287" x2="1088" y2="354" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ded2fb"/>
      <stop offset="23%" stop-color="#c0a4fb"/>
      <stop offset="52%" stop-color="#9878fa"/>
      <stop offset="79%" stop-color="#7666ff"/>
      <stop offset="100%" stop-color="#5a50ed"/>
    </linearGradient>

    <linearGradient id="capUnderGradient" x1="684" y1="356" x2="1036" y2="327" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c57d5"/>
      <stop offset="43%" stop-color="#5637cc"/>
      <stop offset="100%" stop-color="#302fba"/>
    </linearGradient>

    <linearGradient id="leftShieldGradient" x1="604" y1="390" x2="832" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#decdfb"/>
      <stop offset="28%" stop-color="#ba8df7"/>
      <stop offset="62%" stop-color="#7868ff"/>
      <stop offset="100%" stop-color="#5148d6"/>
    </linearGradient>

    <linearGradient id="rightShieldGradient" x1="1058" y1="468" x2="845" y2="781" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7969ff"/>
      <stop offset="45%" stop-color="#624fff"/>
      <stop offset="100%" stop-color="#4d43d1"/>
    </linearGradient>

    <radialGradient id="bubbleGradient" cx="39%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#d1b6fb"/>
      <stop offset="36%" stop-color="#ad82f8"/>
      <stop offset="67%" stop-color="#7f61f1"/>
      <stop offset="100%" stop-color="#5845d8"/>
    </radialGradient>

    <linearGradient id="leafLeftGradient" x1="694" y1="624" x2="827" y2="731" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d5c2fb"/>
      <stop offset="49%" stop-color="#9676f5"/>
      <stop offset="100%" stop-color="#5c4bd9"/>
    </linearGradient>

    <linearGradient id="leafRightGradient" x1="977" y1="625" x2="846" y2="731" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8873fb"/>
      <stop offset="47%" stop-color="#6d56ee"/>
      <stop offset="100%" stop-color="#4d43cd"/>
    </linearGradient>

    <linearGradient id="tasselGradient" x1="1033" y1="345" x2="1065" y2="451" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8373ff"/>
      <stop offset="52%" stop-color="#6e57ee"/>
      <stop offset="100%" stop-color="#5042d0"/>
    </linearGradient>

    <radialGradient id="tasselBallGradient" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bca3fb"/>
      <stop offset="46%" stop-color="#7f66f4"/>
      <stop offset="100%" stop-color="#5143d4"/>
    </radialGradient>

    <filter id="largeBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <filter id="softShadow" x="-28%" y="-25%" width="156%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="12" dy="21" stdDeviation="15" flood-color="#61548d" flood-opacity="0.25"/>
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#5c4ac7" flood-opacity="0.18"/>
    </filter>

    <filter id="tightShadow" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="5" dy="8" stdDeviation="5" flood-color="#5a4bb0" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#312a95" flood-opacity="0.18"/>
    </filter>

    <filter id="innerHole" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#8668ee" flood-opacity="0.27"/>
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.66"/>
    </filter>

    <filter id="fineBlur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

