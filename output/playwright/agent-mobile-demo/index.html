<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>医小管 Agent 手机交互演示</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4f8;
        --surface: #ffffff;
        --surface-2: #efebf1;
        --surface-3: #e6f3ee;
        --text: #25242a;
        --muted: #696570;
        --primary: #5b21b6;
        --primary-soft: #ede3ff;
        --green: #0f7b61;
        --green-soft: #dff4ed;
        --rose: #a92d52;
        --rose-soft: #ffe4ec;
        --amber: #7a5c00;
        --amber-soft: #fff1bd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 5%, rgba(15, 123, 97, 0.12), transparent 26rem),
          radial-gradient(circle at 86% 12%, rgba(169, 45, 82, 0.12), transparent 24rem),
          var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
      }

      .stage {
        width: min(100vw, 430px);
        min-height: 100vh;
        padding: 12px;
        display: grid;
        place-items: center;
      }

      .phone {
        width: min(100%, 390px);
        height: min(844px, calc(100vh - 24px));
        min-height: 720px;
        overflow: hidden;
        border-radius: 34px;
        background: var(--bg);
        box-shadow: 0 20px 70px rgba(40, 28, 52, 0.18);
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .status {
        height: 28px;
        padding: 9px 22px 0;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 700;
        color: #151318;
        flex: 0 0 auto;
      }

      .top {
        padding: 10px 18px 12px;
        display: grid;
        grid-template-columns: 42px 1fr 42px;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
      }

      .icon-button {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        border: 0;
        background: var(--surface);
        color: var(--text);
        font-size: 21px;
        display: grid;
        place-items: center;
      }

      .title {
        min-width: 0;
      }

      .title strong {
        display: block;
        font-size: 18px;
        line-height: 1.2;
      }

      .title span {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .content {
        flex: 1 1 auto;
        overflow: hidden;
        padding: 0 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .task-card {
        border-radius: 24px;
        background: var(--surface);
        padding: 16px;
        flex: 0 0 auto;
      }

      .task-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary);
        display: grid;
        place-items: center;
        font-size: 20px;
        flex: 0 0 auto;
      }

      .task-copy {
        min-width: 0;
        flex: 1;
      }

      .task-copy .label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 5px;
      }

      .task-copy .prompt {
        font-size: 16px;
        line-height: 1.42;
        font-weight: 700;
      }

      .slots {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .slot {
        min-height: 54px;
        border-radius: 18px;
        background: var(--surface-2);
        padding: 9px 10px;
      }

      .slot span {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }

      .slot strong {
        display: block;
        margin-top: 3px;
        font-size: 14px;
      }

      .browser-shell {
        position: relative;
        border-radius: 26px;
        overflow: hidden;
        background: #121116;
        flex: 1 1 auto;
        min-height: 285px;
      }

      .browser-toolbar {
        height: 44px;
        display: grid;
        grid-template-columns: 30px 1fr 30px;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: #201d25;
        color: #eeeaf3;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #35d49f;
        margin-left: 8px;
      }

      .url {
        min-width: 0;
        height: 28px;
        border-radius: 999px;
        background: #312d38;
        color: #d8d1dd;
        display: flex;
        align-items: center;
        padding: 0 11px;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .browser-menu {
        text-align: center;
        font-size: 20px;
        line-height: 1;
      }

      .browser-view {
        position: absolute;
        inset: 44px 0 0;
        background: #fff;
      }

      .browser-view img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
        transition: transform 240ms ease;
      }

      .state-loading .browser-view img {
        transform: translateY(-18px) scale(1.03);
        filter: saturate(0.92);
      }

      .state-login .browser-view img,
      .state-confirm .browser-view img {
        transform: translateY(-6px) scale(1.01);
      }

      .browser-overlay {
        position: absolute;
        inset: 44px 0 0;
        pointer-events: none;
        display: grid;
        align-items: end;
      }

      .browser-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(18, 17, 22, 0) 45%, rgba(18, 17, 22, 0.72) 100%);
      }

      .handoff {
        position: relative;
        margin: 0 12px 12px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.94);
        padding: 12px;
        color: var(--text);
        opacity: 0;
        transform: translateY(14px);
        transition: 180ms ease;
      }

      .handoff strong {
        display: block;
        font-size: 14px;
      }

      .handoff span {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
      }

      .state-login .handoff,
      .state-confirm .handoff {
        opacity: 1;
        transform: translateY(0);
      }

      .timeline {
        border-radius: 24px;
        background: var(--surface);
        padding: 14px;
        display: grid;
        gap: 9px;
        flex: 0 0 auto;
      }

      .step {
        display: grid;
        grid-template-columns: 24px 1fr auto;
        gap: 9px;
        align-items: center;
        min-height: 30px;
      }

      .mark {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: 13px;
        background: var(--surface-2);
        color: var(--muted);
      }

      .step strong {
        min-width: 0;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .step span {
        font-size: 11px;
        color: var(--muted);
      }

      .step.done .mark {
        background: var(--green-soft);
        color: var(--green);
      }

      .step.active .mark {
        background: var(--primary);
        color: #fff;
      }

      .step.warn .mark {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .actions {
        flex: 0 0 auto;
        padding: 12px 16px 18px;
        background: rgba(247, 244, 248, 0.92);
        backdrop-filter: blur(18px);
        display: grid;
        grid-template-columns: 52px 1fr 52px;
        gap: 10px;
      }

      .primary-action {
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }

      .secondary-action {
        border: 0;
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        font-size: 20px;
      }

      .toast {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 88px;
        border-radius: 18px;
        background: #19171d;
        color: #fff;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.35;
        opacity: 0;
        transform: translateY(16px);
        transition: 180ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-height: 780px) {
        .phone {
          min-height: 680px;
        }

        .task-card {
          padding: 13px;
        }

        .slots {
          display: none;
        }

        .timeline {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="phone state-loading" id="phone">
        <div class="status">
          <span>9:41</span>
          <span>5G 100%</span>
        </div>

        <header class="top">
          <button class="icon-button" type="button" aria-label="返回">‹</button>
          <div class="title">
            <strong>AI 事务代办</strong>
            <span id="subtitle">正在理解你的任务</span>
          </div>
          <button class="icon-button" type="button" aria-label="更多">⋯</button>
        </header>

        <div class="content">
          <section class="task-card">
            <div class="task-row">
              <div class="avatar">✦</div>
              <div class="task-copy">
                <div class="label">用户请求</div>
                <div class="prompt">帮我打开豆瓣，搜索《星际穿越》，把第一个结果整理给我。</div>
              </div>
            </div>
            <div class="slots">
              <div class="slot">
                <span>网站</span>
                <strong>豆瓣</strong>
              </div>
              <div class="slot">
                <span>关键词</span>
                <strong>星际穿越</strong>
              </div>
              <div class="slot">
                <span>执行方式</span>
                <strong>自动浏览器</strong>
              </div>
              <div class="slot">
                <span>关键节点</span>
                <strong>人工确认</strong>
              </div>
            </div>
          </section>

          <section class="browser-shell" aria-label="远程浏览器画面">
            <div class="browser-toolbar">
              <div class="dot"></div>
              <div class="url" id="url">douban.com/search?q=星际穿越</div>
              <div class="browser-menu">⋮</div>
            </div>
            <div class="browser-view">
              <img src="./douban-search-mobile.png" alt="豆瓣搜索页截图" />
            </div>
            <div class="browser-overlay">
              <div class="handoff">
                <strong id="handoffTitle">等待你接管官方页面</strong>
                <span id="handoffText">如果出现登录、验证码或敏感输入，系统暂停，用户直接在官方页面操作。</span>
              </div>
            </div>
          </section>

          <section class="timeline">
            <div class="step done">
              <div class="mark">✓</div>
              <strong>提取任务参数</strong>
              <span>完成</span>
            </div>
            <div class="step active" id="stepBrowser">
              <div class="mark">2</div>
              <strong id="stepBrowserText">打开远程浏览器</strong>
              <span id="stepBrowserStatus">进行中</span>
            </div>
            <div class="step" id="stepUser">
              <div class="mark">3</div>
              <strong id="stepUserText">必要时用户接管</strong>
              <span id="stepUserStatus">等待</span>
            </div>
            <div class="step" id="stepResult">
              <div class="mark">4</div>
              <strong>整理结果并确认</strong>
              <span id="stepResultStatus">等待</span>
            </div>
          </section>
        </div>

        <footer class="actions">
          <button class="secondary-action" type="button" id="takeover" aria-label="接管">⌁</button>
          <button class="primary-action" type="button" id="next">继续演示</button>
          <button class="secondary-action" type="button" id="reset" aria-label="重置">↺</button>
        </footer>

        <div class="toast" id="toast">坐标、输入和滚动会回传给后端浏览器；任务完成后只把结果摘要给用户。</div>
      </section>
    </main>

    <script>
      const states = [
        {
          cls: "state-loading",
          subtitle: "正在理解你的任务",
          action: "打开浏览器",
          browserText: "打开远程浏览器",
          browserStatus: "进行中",
          userCls: "",
          userStatus: "等待",
          resultStatus: "等待",
          title: "自动执行中",
          text: "平时浏览器不需要占满屏幕，用户主要看任务状态。",
          toast: "这一步只消耗一次参数提取 token，网页操作由固定流程执行。"
        },
        {
          cls: "state-login",
          subtitle: "需要用户处理敏感节点",
          action: "我已处理",
          browserText: "打开远程浏览器",
          browserStatus: "已打开",
          userCls: "active warn",
          userStatus: "接管",
          resultStatus: "等待",
          title: "等待你接管官方页面",
          text: "遇到登录、验证码、授权时，AI 暂停；用户直接在网页里输入，系统不保存密码。",
          toast: "手机端不是给你一个 VNC 桌面，而是只把当前网页会话交给你。"
        },
        {
          cls: "state-confirm",
          subtitle: "已找到结果，等待确认",
          action: "确认完成",
          browserText: "执行搜索流程",
          browserStatus: "完成",
          userCls: "done",
          userStatus: "完成",
          resultStatus: "确认",
          title: "提交前停一下",
          text: "涉及提交、收藏、申请这类有后果的动作，都在最后一步让用户确认。",
          toast: "学校事务里，这一步对应提交申请前的官方页面确认。"
        }
      ];

      let index = 0;
      const phone = document.getElementById("phone");
      const subtitle = document.getElementById("subtitle");
      const next = document.getElementById("next");
      const reset = document.getElementById("reset");
      const takeover = document.getElementById("takeover");
      const toast = document.getElementById("toast");
      const handoffTitle = document.getElementById("handoffTitle");
      const handoffText = document.getElementById("handoffText");
      const stepBrowser = document.getElementById("stepBrowser");
      const stepBrowserText = document.getElementById("stepBrowserText");
      const stepBrowserStatus = document.getElementById("stepBrowserStatus");
      const stepUser = document.getElementById("stepUser");
      const stepUserStatus = document.getElementById("stepUserStatus");
      const stepResult = document.getElementById("stepResult");
      const stepResultStatus = document.getElementById("stepResultStatus");

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function render() {
        const state = states[index];
        phone.className = "phone " + state.cls;
        subtitle.textContent = state.subtitle;
        next.textContent = state.action;
        handoffTitle.textContent = state.title;
        handoffText.textContent = state.text;
        stepBrowser.className = index === 0 ? "step active" : "step done";
        stepBrowserText.textContent = state.browserText;
        stepBrowserStatus.textContent = state.browserStatus;
        stepUser.className = "step " + state.userCls;
        stepUserStatus.textContent = state.userStatus;
        stepResult.className = index === 2 ? "step active" : "step";
        stepResultStatus.textContent = state.resultStatus;
        showToast(state.toast);
      }

      next.addEventListener("click", () => {
        index = Math.min(index + 1, states.length - 1);
        render();
      });

      reset.addEventListener("click", () => {
        index = 0;
        render();
      });

      takeover.addEventListener("click", () => {
        index = 1;
        render();
      });

      render();
    </script>
  </body>
</html>
